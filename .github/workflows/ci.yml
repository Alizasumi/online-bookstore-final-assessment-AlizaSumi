name: CI - Tests & Coverage
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov beautifulsoup4

      # 🧭 ADD THIS SECTION (diagnostic step)
      - name: Diagnose collection
        working-directory: ./online-bookstore-qa-aliza-sumi
        run: |
          pwd
          ls -R
          pytest --collect-only -q

      # ✅ MAIN TEST STEP
      - name: Run tests with coverage
        working-directory: ./online-bookstore-qa-aliza-sumi
        env:
          PYTHONPATH: ${{ github.workspace }}/online-bookstore-qa-aliza-sumi
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=html:../coverage_html

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage_html
          path: coverage_html
