name: CI - Tests & Coverage

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: online-bookstore-qa-aliza-sumi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov beautifulsoup4

      # Run pytest from the subfolder where your app and tests live
      - name: Run tests with coverage
        working-directory: online-bookstore-qa-aliza-sumi
        env:
          PYTHONPATH: ${{ github.workspace }}/online-bookstore-qa-aliza-sumi
        run: |
          pytest -q --maxfail=1 --disable-warnings \
            --cov=. --cov-report=term-missing \
            --cov-report=html:${{ github.workspace }}/coverage_html \
            --junitxml=${{ github.workspace }}/test-results.xml

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage_html
          path: coverage_html

      - name: Upload JUnit (optional)
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: test-results.xml

      # Optional gate: fail if coverage < 80%
      - name: Enforce coverage ≥80%
        run: |
          python - << 'PY'
          import sys, re, pathlib
          report = pathlib.Path('coverage_html/index.html').read_text(errors='ignore')
          m = re.search(r'Coverage.*?(\d+)\.?(\d*)%', report)
          pct = float(m.group(1) + '.' + (m.group(2) or '0')) if m else 0.0
          print(f'coverage={pct}%')
          sys.exit(0 if pct >= 80 else 1)
          PY
